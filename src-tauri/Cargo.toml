[package]
name = "app"
version = "0.2.0-beta.3"
description = "DiaryNote Desktop Application"
authors = ["DiaryNote Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
argon2 = "0.5"
pbkdf2 = { version = "0.12", default-features = false, features = ["simple", "std"] }
hmac = "0.12"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
subtle = "2.6"
pulldown-cmark = { version = "0.12", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1.38", features = ["sync", "rt", "macros"] }
ts-rs = { version = "10.1", features = ["serde-compat", "chrono-impl"] }

[features]
devtools = ["tauri/devtools"]


