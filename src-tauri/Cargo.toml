[package]
name = "app"
version = "0.2.0-beta.2"
description = "DiaryNote Desktop Application"
authors = ["DiaryNote Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
base64 = "0.22"
