name: "Release Multi-Platform Binaries"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.1.2)"
        required: true
        default: "v0.1.2"
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "Multi-platform release binaries for DiaryNote."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create and Upload Standalone Linux Package (DiaryNote-linux-x86_64.tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          mkdir -p dist_standalone
          BIN_PATH=$(find src-tauri/target -type f \( -name "app" -o -name "DiaryNote" -o -name "diary-note" \) | grep "release" | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            cp "$BIN_PATH" dist_standalone/DiaryNote
          elif [ -f build-arch/DiaryNote ]; then
            cp build-arch/DiaryNote dist_standalone/DiaryNote
          fi
          [ -f build-arch/DiaryNote.desktop ] && cp build-arch/DiaryNote.desktop dist_standalone/DiaryNote.desktop || true
          [ -f build-arch/DiaryNote.png ] && cp build-arch/DiaryNote.png dist_standalone/DiaryNote.png || true
          [ -f build-arch/install.sh ] && cp build-arch/install.sh dist_standalone/install.sh || true
          chmod +x dist_standalone/DiaryNote 2>/dev/null || true
          tar -czvf DiaryNote-linux-x86_64.tar.gz -C dist_standalone .
          gh release upload "$TAG" DiaryNote-linux-x86_64.tar.gz --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Versioned macOS Archive (.app.tar.gz with version)
        if: matrix.platform == 'macos-latest'
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          for f in $(find src-tauri/target -name "DiaryNote_*.app.tar.gz"); do
            FNAME=$(basename "$f")
            if [[ "$FNAME" =~ ^DiaryNote_(aarch64|x64|x86_64)\.app\.tar\.gz$ ]]; then
              ARCH="${BASH_REMATCH[1]}"
              VERSIONED_NAME="DiaryNote_${VER}_${ARCH}.app.tar.gz"
              cp "$f" "$VERSIONED_NAME"
              gh release upload "$TAG" "$VERSIONED_NAME" --clobber || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Release Notes Markdown if available
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release edit "$TAG" -F "$NOTES_FILE" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            DiaryNote-linux-x86_64.tar.gz
            DiaryNote_*.app.tar.gz

