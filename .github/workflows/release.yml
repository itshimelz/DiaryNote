name: "Release Multi-Platform Pure Rust Binaries"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.2.0)"
        required: true
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      ver: ${{ steps.validate.outputs.ver }}
      notes_file: ${{ steps.validate.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release prerequisites
        id: validate
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          NOTES_FILE=".github/releases/RELEASE_NOTES_${TAG}.md"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

          # Extract version from root or app Cargo.toml
          if [ -f Cargo.toml ]; then
            CARGO_VER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2 || echo "")
          fi
          if [ -z "$CARGO_VER" ] && [ -f crates/app/Cargo.toml ]; then
            CARGO_VER=$(grep '^version' crates/app/Cargo.toml | head -1 | cut -d'"' -f2 || echo "")
          fi

          if [ -n "$CARGO_VER" ] && [ "$CARGO_VER" != "$VER" ]; then
            echo "::warning::Cargo.toml version ($CARGO_VER) does not strictly match tag ($VER)"
          fi

  build-release:
    name: Build Binary (${{ matrix.platform.name }})
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "Linux (x86_64)"
            os: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            artifact_name: "DiaryNote-linux-x86_64.tar.gz"
          - name: "macOS Apple Silicon (aarch64)"
            os: "macos-latest"
            target: "aarch64-apple-darwin"
            artifact_name: "DiaryNote-macos-aarch64.tar.gz"
          - name: "macOS Intel (x86_64)"
            os: "macos-13"
            target: "x86_64-apple-darwin"
            artifact_name: "DiaryNote-macos-x86_64.tar.gz"
          - name: "Windows (x86_64)"
            os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            artifact_name: "DiaryNote-windows-x86_64.zip"

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libasound2-dev \
            libvulkan-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build Release Binary
        run: |
          cargo build --release --target ${{ matrix.platform.target }} -p app || cargo build --release --target ${{ matrix.platform.target }}

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist_pkg
          BIN_PATH=$(find target/${{ matrix.platform.target }}/release target/release -maxdepth 2 -type f \( -name "app" -o -name "DiaryNote" -o -name "diarynote" \) | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            cp "$BIN_PATH" dist_pkg/DiaryNote
            chmod +x dist_pkg/DiaryNote
          fi
          [ -f assets/DiaryNote.desktop ] && cp assets/DiaryNote.desktop dist_pkg/ || true
          [ -f assets/logo.png ] && cp assets/logo.png dist_pkg/DiaryNote.png || true
          tar -czvf ${{ matrix.platform.artifact_name }} -C dist_pkg .

      - name: Package macOS Binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist_pkg
          BIN_PATH=$(find target/${{ matrix.platform.target }}/release target/release -maxdepth 2 -type f \( -name "app" -o -name "DiaryNote" -o -name "diarynote" \) | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            cp "$BIN_PATH" dist_pkg/DiaryNote
            chmod +x dist_pkg/DiaryNote
          fi
          tar -czvf ${{ matrix.platform.artifact_name }} -C dist_pkg .

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist_pkg
          BIN_PATH=$(find target/${{ matrix.platform.target }}/release target/release -maxdepth 2 -type f \( -name "app.exe" -o -name "DiaryNote.exe" -o -name "diarynote.exe" \) | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            cp "$BIN_PATH" dist_pkg/DiaryNote.exe
          fi
          cd dist_pkg && 7z a -tzip ../${{ matrix.platform.artifact_name }} *

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: ${{ matrix.platform.artifact_name }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
