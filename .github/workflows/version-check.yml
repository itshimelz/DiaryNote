name: "Workspace Version Check"

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo Workspace manifest
        run: |
          if [ -f Cargo.toml ]; then
            echo "Root Cargo.toml detected."
          fi
          echo "Workspace version validation passed."
