name: "Prepare Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.3, no v prefix)"
        required: true
      push_tag:
        description: "Push commit and tag to trigger release build"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release notes exist
        run: |
          VERSION="${{ inputs.version }}"
          NOTES_FILE=".github/releases/RELEASE_NOTES_v${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing release notes: $NOTES_FILE"
            echo "Create the release notes file before running Prepare Release."
            exit 1
          fi

      - name: Bump and sync version
        run: bun run version:set "${{ inputs.version }}"

      - name: Refresh Cargo.lock
        working-directory: src-tauri
        run: cargo check

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit -m "chore(release): v${{ inputs.version }}"

      - name: Create annotated tag
        run: git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"

      - name: Push commit and tag
        if: inputs.push_tag
        run: |
          git push origin HEAD
          git push origin "v${{ inputs.version }}"
